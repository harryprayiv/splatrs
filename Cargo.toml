[package]
name = "splatrs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
description = "3D Gaussian splatting trainer and renderer: a CPU reference implementation with analytic, finite-difference-checked gradients"

[features]
default = []
# Build every scalar as f64. Used by the gradient-check tests; slower for real training.
f64 = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
kiddo = "5"
rand = "0.9"
rand_chacha = "0.9"
rayon = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 2
